# Secret Scan mit gitleaks
#
# Sucht nach Zugangsdaten, Schlüsseln und Tokens im Code und in der Git-Historie.
# Läuft bei jedem Pull Request, bei jedem Push auf main und einmal pro Woche über die ganze Historie.
# Keine Kosten, keine Lizenz: gitleaks läuft als Programm (MIT-Lizenz), nicht als Marketplace-Action.
#
# Die Prüfsumme der heruntergeladenen Datei wird vor dem Entpacken kontrolliert.
# Neue gitleaks-Version: Nummer und beide Prüfsummen unten gemeinsam ändern (die Prüfsummen stehen
# in der Datei gitleaks_<Version>_checksums.txt auf der Release-Seite von gitleaks, je eine Zeile für
# linux_x64 und linux_arm64).
#
# Wo der Scan läuft:
# - Private Repositories laufen auf dem selbst gehosteten Runner (Linux, ARM64), weil das Freikontingent
#   der GitHub-gehosteten Runner erschöpft ist.
# - Öffentliche Repositories laufen weiter auf ubuntu-latest. Öffentliche Repositories dürfen nie auf
#   den selbst gehosteten Runner, sonst könnte fremder Code aus einem Pull Request dort laufen.
# - Der Runner hat kein sudo. gitleaks wird deshalb in das temporäre Verzeichnis des Laufs installiert.
# - Ein privates Repository mit diesem Workflow wartet in der Warteschlange, solange kein passender
#   Runner online ist. Deshalb die Datei erst in ein privates Repository kopieren, wenn der Runner läuft.
#
# Beim Kopieren in viele Repositories die Minute im Zeitplan (cron) jeweils verschieben, sonst starten
# alle Wochenläufe gleichzeitig und warten auf die wenigen Runner.
#
# Wichtig: Der Workflow prüft nach dem Push. Ein Secret, das hier gefunden wird, steht bereits im
# Repository und gilt als bekannt. Vorgehen steht in docs/SECRET_GEFUNDEN.md.

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GITLEAKS_SHA256_ARM64: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"

jobs:
  gitleaks:
    name: gitleaks
    # Privat: selbst gehosteter Runner (Linux, ARM64). Öffentlich: GitHub-gehosteter Runner.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","arm64"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Repository auschecken, volle Historie
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks installieren, Prüfsumme kontrollieren
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              arch="x64"
              summe="${GITLEAKS_SHA256_X64}"
              ;;
            aarch64|arm64)
              arch="arm64"
              summe="${GITLEAKS_SHA256_ARM64}"
              ;;
            *)
              echo "Nicht unterstützte Architektur: $(uname -m)" >&2
              exit 1
              ;;
          esac
          datei="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          curl -fsSL -o "${RUNNER_TEMP}/${datei}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${datei}"
          echo "${summe}  ${RUNNER_TEMP}/${datei}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${datei}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          chmod 0755 "${RUNNER_TEMP}/gitleaks-bin/gitleaks"
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" version

      - name: Nach Secrets suchen
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Eine Datei .gitleaks.toml im Repository wird automatisch verwendet.
          # Die Marke "gitleaks:allow" im Code wird bewusst ignoriert, Ausnahmen gehören in die
          # Konfigurationsdatei und damit in einen Pull Request mit Review.
          args=(git --redact --no-banner --verbose --ignore-gitleaks-allow)
          zero="0000000000000000000000000000000000000000"
          bereich=""
          case "${EVENT_NAME}" in
            pull_request)
              bereich="${PR_BASE}..${PR_HEAD}"
              ;;
            push)
              if [ "${PUSH_BEFORE}" != "${zero}" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                bereich="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
              ;;
          esac
          if [ -n "${bereich}" ]; then
            echo "Geprüft werden die Commits ${bereich}"
            args+=("--log-opts=${bereich}")
          else
            echo "Geprüft wird die gesamte Historie"
          fi
          gitleaks "${args[@]}" .

      - name: Hinweis bei Fund
        if: failure()
        run: |
          {
            echo "## Secret gefunden"
            echo
            echo "gitleaks hat mögliche Zugangsdaten gemeldet. Die Fundstellen stehen im Protokoll des Schritts davor, die Werte sind geschwärzt."
            echo
            echo "1. Das Secret sofort beim Dienst widerrufen oder erneuern. Das Löschen aus dem Code reicht nicht, die Historie bleibt lesbar."
            echo "2. Danach die Datei bereinigen und bei einem Fehlalarm die Ausnahme in .gitleaks.toml per Pull Request eintragen."
            echo "3. Ablauf im Detail: docs/SECRET_GEFUNDEN.md"
          } >> "${GITHUB_STEP_SUMMARY}"
